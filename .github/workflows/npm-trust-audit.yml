name: Audit npm trusted publishers

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Read trusted publisher claims
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.17.0"
          for package in @routeplane/sdk @routeplane/cli @routeplane/mcp-server; do
            echo "${package}"
            npm trust list "${package}" --registry=https://registry.npmjs.org/ --json \
              | jq 'map({type, claims, permissions})'
          done
