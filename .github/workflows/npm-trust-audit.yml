name: Audit npm trusted publishers

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Verify OIDC publisher exchanges
        run: |
          set -euo pipefail

          oidc_response="$(curl --disable --proto '=https' --max-redirs 0 \
            --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org")"
          oidc_token="$(jq -er '.value' <<< "${oidc_response}")"

          payload="${oidc_token#*.}"
          payload="${payload%%.*}"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "${payload}" | tr '_-' '/+' | base64 -d \
            | jq '{sub, repository, workflow_ref, job_workflow_ref, environment}'

          failed=0
          for package in '@routeplane%2fsdk' '@routeplane%2fcli' '@routeplane%2fmcp-server'; do
            response="$(curl --disable --proto '=https' --max-redirs 0 \
              --silent --show-error --request POST \
              --header "Authorization: Bearer ${oidc_token}" \
              --write-out $'\n%{http_code}' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${package}")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            printf '%s: HTTP %s\n' "${package}" "${status}"
            jq 'del(.token)' <<< "${body}"
            if [[ "${status}" != 200 ]]; then
              failed=1
            fi
          done
          test "${failed}" -eq 0
