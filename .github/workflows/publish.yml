name: Publish to npm
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the attestation binds the published tarball to this
      # workflow run via an OIDC token. Composes with NODE_AUTH_TOKEN auth.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with a provenance attestation (Sigstore, via the job's OIDC
          # id-token) so every @routeplane/* release is publicly verifiable
          # back to this repo + workflow run.
          NPM_CONFIG_PROVENANCE: 'true'
